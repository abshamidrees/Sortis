<text x="1187.3333333333335" y="668" text-anchor="end" font-family="IBM Plex Mono" font-size="14" font-weight="600" fill="#A87A2E" style="font-variant-numeric:tabular-nums">32 stakes, 4,476,000. One shard. This is what ships.</text>
<text x="1252.7007327330757" y="212" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#8C3A28">Linear scan, derived</text>
<text x="1372" y="244.586" text-anchor="end" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#A87A2E">Sortis, measured</text>
<rect x="268.5" y="626.5" width="386" height="96" fill="none" stroke="#CDD2C9" stroke-width="1"/>
<text x="286" y="652" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#1A1E1B" letter-spacing="1.2">MEASURED ON CHAIN</text>
<text x="286" y="676" font-family="IBM Plex Mono" font-size="13" fill="#565C56">predicted</text>
<text x="398" y="676" font-family="IBM Plex Mono" font-size="13" fill="#1A1E1B" style="font-variant-numeric:tabular-nums">4,476,000</text>
<text x="286" y="696" font-family="IBM Plex Mono" font-size="13" fill="#565C56">observed</text>
<text x="398" y="696" font-family="IBM Plex Mono" font-size="13" fill="#1A1E1B" style="font-variant-numeric:tabular-nums">4,476,000</text>
<text x="286" y="716" font-family="IBM Plex Mono" font-size="13" fill="#565C56">divergence</text>
<text x="398" y="716" font-family="IBM Plex Mono" font-size="13" fill="#1A1E1B" style="font-variant-numeric:tabular-nums">0.00%, at the deployed height</text>
<text x="40" y="784" font-family="Inter" font-size="13" fill="#565C56">Sequential HCU per draw against the FHEVM 5,000,000 depth limit. Walk height 5 at the deployed shard.</text>
<text x="40" y="806" font-family="Inter" font-size="13" fill="#565C56">Sortis figures measured by sweeping register sizes until the walk reverts. The linear series is derived from a per-depositor constant of 162,000 HCU,</text>
<text x="40" y="828" font-family="Inter" font-size="13" fill="#565C56">because a scan that reverts cannot be measured past the point it stops fitting. Reproduce with npm test.</text>
